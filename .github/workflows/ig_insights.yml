# Instagram の数字（インサイト）を毎晩取って data/insights/ に残し、鍵が生きているかを確かめる（tools/ig_insights.py）。
# - 毎晩 23:50（日本時間）。ストーリーの数字は24時間で消えるので、その日の分を必ずこの時間に取る。
# - Claude のコネクタは使わない。投稿と同じ GitHub Secrets の鍵を使うので、設定し直しは要らない。
# - 鍵が切れた・期限が近いときは ChatWork に直し方つきで知らせる。
# - 止めたいときは Variables の IG_INSIGHTS_ENABLED を消す（または false）。
name: ig_insights

on:
  schedule:
    - cron: "50 14 * * *"  # UTC 14:50 = 日本時間 23:50
  workflow_dispatch:
    inputs:
      days:
        description: "アカウントの数字を取り直す日数"
        default: "3"
      dry_run:
        description: "1 = 保存・通知しない / 0 = 保存して ChatWork に送る"
        default: "0"
        type: choice
        options: ["0", "1"]

concurrency:
  group: ig_insights
  cancel-in-progress: false

permissions:
  contents: write  # data/insights/ の CSV を main に保存するため

jobs:
  insights:
    if: github.event_name == 'workflow_dispatch' || vars.IG_INSIGHTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: read Instagram insights
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ vars.CHATWORK_ROOM_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python3 tools/ig_insights.py --days "${{ github.event_name == 'workflow_dispatch' && inputs.days || '3' }}"
      - name: save CSV to main
        if: success()
        run: |
          git config user.name "ig-insights-bot"
          git config user.email "ig-insights-bot@users.noreply.github.com"
          git add data/insights/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "insights: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "push に失敗"; exit 1
