<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>運用の全体図</title>
<style>
:root{--ink:#142a5c;--teal:#18a0b2;--yel:#ffec1e;--bg:#ffffff;--sub:#5b6b8c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8eefc;--bg:#0f1a33;--sub:#a9b6d3}}
:root[data-theme="dark"]{--ink:#e8eefc;--bg:#0f1a33;--sub:#a9b6d3}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px}
h1{font-size:26px;margin:0 0 4px}p.lead{margin:0 0 16px;color:var(--sub)}
svg{width:100%;height:auto}.box{fill:none;stroke:var(--teal);stroke-width:3}.hub{fill:var(--teal)}
.t{fill:var(--ink);font-size:17px;font-weight:700;text-anchor:middle}.s{fill:var(--sub);font-size:13px;text-anchor:middle}
.ht{fill:#fff;font-size:20px;font-weight:800;text-anchor:middle}.ar{stroke:var(--ink);stroke-width:2.5;marker-end:url(#m);marker-start:url(#m)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}
.card{border:2px solid var(--teal);border-radius:10px;padding:10px 12px}.card b{background:var(--yel);color:#142a5c;padding:0 4px}
</style></head><body><main>
<h1>全部の AI は、シートと Obsidian を通って行き来する</h1>
<p class="lead">K13 運用の仕方（11/28・完成度1）。AI どうしは直接つながず、真ん中の2つに置く・読む。</p>
<svg viewBox="0 0 800 560" role="img" aria-label="シートとObsidianを中心に、Claude Code、Muse 1・2、Dola 1・2、Grok、Grok Bot が双方向でつながる図">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" style="color:var(--ink)"/></marker></defs>
<rect class="hub" x="290" y="220" width="220" height="110" rx="14"/>
<text class="ht" x="400" y="268">シート・Obsidian</text><text class="ht" x="400" y="298" style="font-size:15px">数字は行・文は 00_Inbox</text>
<g>
<rect class="box" x="300" y="20" width="200" height="80" rx="12"/><text class="t" x="400" y="55">Claude Code（33人）</text><text class="s" x="400" y="80">正本・集計・Instagram</text>
<rect class="box" x="20" y="150" width="200" height="80" rx="12"/><text class="t" x="120" y="185">Muse 1・2</text><text class="s" x="120" y="210">他SNS・note・速報 22:30</text>
<rect class="box" x="580" y="150" width="200" height="80" rx="12"/><text class="t" x="680" y="185">Dola 1・2</text><text class="s" x="680" y="210">整理・お金の数字 23:30</text>
<rect class="box" x="20" y="340" width="200" height="80" rx="12"/><text class="t" x="120" y="375">Grok</text><text class="s" x="120" y="400">X の型 9:00</text>
<rect class="box" x="580" y="340" width="200" height="80" rx="12"/><text class="t" x="680" y="375">Grok Bot</text><text class="s" x="680" y="400">X の下書き 随時</text>
<rect class="box" x="300" y="460" width="200" height="80" rx="12"/><text class="t" x="400" y="495">加藤さん</text><text class="s" x="400" y="520">写真を入れる・GO を出す</text>
</g>
<line class="ar" x1="400" y1="104" x2="400" y2="216"/><line class="ar" x1="224" y1="200" x2="288" y2="240"/><line class="ar" x1="576" y1="200" x2="512" y2="240"/>
<line class="ar" x1="224" y1="370" x2="288" y2="315"/><line class="ar" x1="576" y1="370" x2="512" y2="315"/><line class="ar" x1="400" y1="456" x2="400" y2="334"/>
</svg>
<div class="row">
<div class="card"><b>お金</b> 月30万＝イベント5万（達成・除外）＋残り25万</div>
<div class="card"><b>アカウント</b> 1＝食事・AI／2＝スポーツ</div>
<div class="card"><b>回</b> 8:00 → 23:55 会議 → 日曜 動画のまとめ</div>
</div>
</main></body></html>
