<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:NB;src:url("../fonts/NotoSansCJK-Black.ttc")}
@font-face{font-family:NM;src:url("../fonts/NotoSansCJK-Bold.ttc")}
html,body{margin:0;background:#0f1730}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 土台（Claude Code・Muse×2・シート）＋追加（Dola・Obsidian）の説明動画。render(t)
const C=document.getElementById('c'),X=C.getContext('2d');const W=1080,H=1920;
const COL={cc:'#ff8a3d',ms:'#3cc4d6',ma:'#b48cf0',dola:'#4cd38a',obs:'#ffec1e',ka:'#ff5a6e'};
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
function rr(x,y,w,h,r,c){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill();}
function tx(s,x,y,sz,c,f='NB',al='center'){X.font=`${sz}px ${f}`;X.textAlign=al;X.textBaseline='middle';X.fillStyle=c;X.fillText(s,x,y);}
function lines(arr,x,y,sz,c,gap,f='NM',al='left'){arr.forEach((s,i)=>tx(s,x,y+i*gap,sz,c,f,al));}
function box(x,y,w,h,col,title,sub,a=1){X.globalAlpha=a;rr(x,y,w,h,28,'#1b2650');rr(x,y,14,h,7,col);tx(title,x+w/2+7,y+h/2-(sub?24:0),46,col);if(sub)tx(sub,x+w/2+7,y+h/2+34,32,'#dfe6ff','NM');X.globalAlpha=1;}
function arrow(x1,y1,x2,y2,p,col){if(p<=0)return;const x=x1+(x2-x1)*p,y=y1+(y2-y1)*p;X.strokeStyle=col;X.lineWidth=10;X.lineCap='round';X.beginPath();X.moveTo(x1,y1);X.lineTo(x,y);X.stroke();
 if(p>=1){const a=Math.atan2(y2-y1,x2-x1);X.beginPath();X.moveTo(x2,y2);X.lineTo(x2-34*Math.cos(a-.5),y2-34*Math.sin(a-.5));X.moveTo(x2,y2);X.lineTo(x2-34*Math.cos(a+.5),y2-34*Math.sin(a+.5));X.stroke();}}
function head(s,sub){rr(0,0,W,230,0,'#0b1228');tx(s,W/2,90,62,'#fff');if(sub)tx(sub,W/2,170,40,'#ffec1e','NM');}
function foot(){tx('マカシェット AI社員の会社',W/2,H-70,32,'#ffffff88','NM');}
function card(y,col,name,items,a){X.globalAlpha=a;rr(60,y,960,140+items.length*70,30,'#1b2650');rr(60,y,960,96,30,col);tx(name,W/2,y+50,50,'#0f1730');lines(items.map(s=>'・'+s),110,y+150,40,'#fff',70);X.globalAlpha=1;}
window.render=function(t){
 X.fillStyle='#0f1730';X.fillRect(0,0,W,H);const A1='#ff7a4a',A2='#4a9bff';
 if(t<6){const a=ease(seg(t,0,.8));X.globalAlpha=a;tx('AI社員の会社の地図',W/2,520,84,'#fff');tx('アカウント2つ・33人で全部考える',W/2,640,48,'#ffec1e','NM');X.globalAlpha=1;
  box(80,820,440,260,A1,'アカウント1','食事＋AI',ease(seg(t,1.5,2.2)));box(560,820,440,260,A2,'アカウント2','スポーツ',ease(seg(t,2,2.7)));
  const q=ease(seg(t,3,3.6));X.globalAlpha=q;tx('はじめての人へ・60秒',W/2,1250,44,'#dfe6ff','NM');X.globalAlpha=1;foot();return;}
 if(t<14){head('会社の形','誰が何をするか');
  card(300,A1,'アカウント1（食事＋AI）',['Instagram @kkbirthday0129（Muse 1）','note AI・ココナラ・クラウドワークス','食事の告知・公式LINE（食事）'],ease(seg(t,6.2,7)));
  card(820,A2,'アカウント2（スポーツ）',['Instagram @macachette_sports（自動）','note メイン・YouTube・TikTok','LINE スタンプ・イベントアプリ'],ease(seg(t,8,8.8)));
  const a=ease(seg(t,10,10.8));X.globalAlpha=a;rr(60,1360,960,200,30,'#1b2650');lines(['作る＝Claude Code（33人の会議）','出す＝Muse 1・2　整理＝Dola 1・2'],W/2,1430,42,'#fff',70,'NM','center');X.globalAlpha=1;foot();return;}
 if(t<24){head('1日の流れ','朝に数字・昼は自動・夜に1つ直す');
  const R=[['8:00','Claude Code','数字を読む・Merge・今日のタスク',COL.cc],['8〜19時','自動','Instagram ストーリー15本など',COL.ms],['1日4回','Muse 1・2','各SNS・イベントアプリに出す',COL.ms],['22:30','Muse','その日の数字の速報',COL.ma],['23:30','Dola 2','お金と数字を1枚に',COL.dola],['23:55','Claude Code','会議→明日の改善1つ・明日の分を作る',COL.cc]];
  R.forEach((r,i)=>{const a=ease(seg(t,14.3+i*1.2,15+i*1.2));X.globalAlpha=a;rr(60,290+i*215,960,185,26,'#1b2650');rr(60,290+i*215,16,185,8,r[3]);tx(r[0],210,345+i*215,48,r[3]);tx(r[1],210,415+i*215,32,'#dfe6ff','NM');tx(r[2],640,380+i*215,36,'#fff','NM');X.globalAlpha=1;});foot();return;}
 if(t<32){head('週と月の流れ','決まった回だけ動く');
  card(300,COL.cc,'毎週',['月・水 21:00 リール・カルーセル','金 21:30 翌週のストーリー','日 18:30 Muse が週の数字','日 21:00 週の振り返り・判定'],ease(seg(t,24.2,25)));
  card(1000,COL.dola,'毎月',['第1日曜 月の目標と比べて短縮策を1つ','Obsidian を一周して軽くする'],ease(seg(t,27,27.8)));foot();return;}
 if(t<41){head('全媒体の振り分け','どこに・誰が出すか');
  const R=[['Instagram ×2','自動／Muse 1'],['公式LINE ×2','加藤さん／Muse 1'],['YouTube・TikTok','Muse 2・Muse 1'],['X など','Muse 1・2（ログイン後）'],['note ×2','Muse 2・Muse 1'],['イベントアプリ ×2','Muse 2・Muse 1'],['ココナラ・CW','Muse 1（注文は全部受ける）'],['スタンプ・アフィ','Muse 2・Muse 1']];
  R.forEach((r,i)=>{const a=ease(seg(t,32.2+i*.6,32.8+i*.6));X.globalAlpha=a;rr(60,290+i*160,960,135,22,'#1b2650');tx(r[0],320,357+i*160,40,'#ffec1e');tx(r[1],760,357+i*160,34,'#fff','NM');X.globalAlpha=1;});
  const q=ease(seg(t,38,38.6));X.globalAlpha=q;tx('止めている物：HP・WordPress・Google ビジネス',W/2,1640,34,'#ffb3a0','NM');X.globalAlpha=1;foot();return;}
 if(t<49){head('お金の道筋','月30万＝イベント5万（数えない）＋25万');
  const B=[['① 運用代行',12.8,COL.ms],['② note',7.8,A2],['③ 単発の制作',3.6,A1],['④ アフィ・タイアップ',1,COL.dola],['⑤ LINE スタンプ',0.75,COL.ma]];
  B.forEach((b,i)=>{const p=ease(seg(t,41.3+i*.6,42.2+i*.6));tx(b[0],80,330+i*180,40,'#fff','NM','left');rr(80,365+i*180,Math.max(8,760*(b[1]/12.8)*p),60,14,b[2]);tx(b[1]+'万',900,395+i*180,40,'#ffec1e');});
  const q=ease(seg(t,45,45.7));X.globalAlpha=q;rr(60,1270,960,260,30,'#1b2650');lines(['12月1万 → 1月4万 → 2月8万','3月13万 → 4月19万 → 5月25万'],W/2,1350,40,'#fff',80,'NM','center');X.globalAlpha=1;foot();return;}
 if(t<55){head('写真の置き場','食事とスポーツは混ぜない');
  card(300,A1,'食事 → Drive「Macachette食事素材」',['00_共通素材（店内・料理・道具）','月ごと →「日付_会の名前」'],ease(seg(t,49.2,50)));
  card(850,A2,'スポーツ → Drive「Macachette素材」',['月ごと →「日付_種目_会場」','開催の日の夜に入れる'],ease(seg(t,50.5,51.3)));
  const q=ease(seg(t,52,52.6));X.globalAlpha=q;tx('顔はこちらで隠してから使う',W/2,1400,44,'#ffec1e');X.globalAlpha=1;foot();return;}
 head('加藤さんがすること','毎朝のタスクを上からやるだけ');
 [['決める','GO・大きなルール・注文の判断',COL.ka],['見る','出た投稿と数字に「直して」',COL.cc],['撮る','開催・食事の会の写真をDriveへ',COL.ms]].forEach((r,i)=>{const a=ease(seg(t,55.2+i*.5,55.8+i*.5));X.globalAlpha=a;rr(60,320+i*260,960,220,30,'#1b2650');rr(60,320+i*260,20,220,10,r[2]);tx(r[0],W/2,390+i*260,60,r[2]);tx(r[1],W/2,470+i*260,38,'#fff','NM');X.globalAlpha=1;});
 X.globalAlpha=ease(seg(t,57,57.8));rr(60,1150,960,240,30,'#2a3570');tx('完成度1 → 1億',W/2,1220,50,'#ffec1e');tx('数字で毎日1つずつ上げていく',W/2,1310,40,'#fff','NM');X.globalAlpha=1;foot();
};
window.render(0);
</script></body></html>
