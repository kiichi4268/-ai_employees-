<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:NB;src:url("../fonts/NotoSansCJK-Black.ttc")}
@font-face{font-family:NM;src:url("../fonts/NotoSansCJK-Bold.ttc")}
html,body{margin:0;background:#0f1730}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 土台（Claude Code・Muse×2・シート）＋追加（Dola・Obsidian）の説明動画。render(t)
const C=document.getElementById('c'),X=C.getContext('2d');const W=1080,H=1920;
const COL={cc:'#ff8a3d',ms:'#3cc4d6',ma:'#b48cf0',dola:'#4cd38a',obs:'#ffec1e',ka:'#ff5a6e'};
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
function rr(x,y,w,h,r,c){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill();}
function tx(s,x,y,sz,c,f='NB',al='center'){X.font=`${sz}px ${f}`;X.textAlign=al;X.textBaseline='middle';X.fillStyle=c;X.fillText(s,x,y);}
function lines(arr,x,y,sz,c,gap,f='NM',al='left'){arr.forEach((s,i)=>tx(s,x,y+i*gap,sz,c,f,al));}
function box(x,y,w,h,col,title,sub,a=1){X.globalAlpha=a;rr(x,y,w,h,28,'#1b2650');rr(x,y,14,h,7,col);tx(title,x+w/2+7,y+h/2-(sub?24:0),46,col);if(sub)tx(sub,x+w/2+7,y+h/2+34,32,'#dfe6ff','NM');X.globalAlpha=1;}
function arrow(x1,y1,x2,y2,p,col){if(p<=0)return;const x=x1+(x2-x1)*p,y=y1+(y2-y1)*p;X.strokeStyle=col;X.lineWidth=10;X.lineCap='round';X.beginPath();X.moveTo(x1,y1);X.lineTo(x,y);X.stroke();
 if(p>=1){const a=Math.atan2(y2-y1,x2-x1);X.beginPath();X.moveTo(x2,y2);X.lineTo(x2-34*Math.cos(a-.5),y2-34*Math.sin(a-.5));X.moveTo(x2,y2);X.lineTo(x2-34*Math.cos(a+.5),y2-34*Math.sin(a+.5));X.stroke();}}
function head(s,sub){rr(0,0,W,230,0,'#0b1228');tx(s,W/2,90,62,'#fff');if(sub)tx(sub,W/2,170,40,'#ffec1e','NM');}
function foot(){tx('マカシェット AI社員の会社',W/2,H-70,32,'#ffffff88','NM');}
function card(y,col,name,items,a){X.globalAlpha=a;rr(60,y,960,140+items.length*70,30,'#1b2650');rr(60,y,960,96,30,col);tx(name,W/2,y+50,50,'#0f1730');lines(items.map(s=>'・'+s),110,y+150,40,'#fff',70);X.globalAlpha=1;}
window.render=function(t){
 X.fillStyle='#0f1730';X.fillRect(0,0,W,H);
 if(t<6){ // 1 タイトル
  const a=ease(seg(t,0,.8));X.globalAlpha=a;tx('土台は3つで回す',W/2,500,84,'#fff');tx('Dola は「あれば＋」',W/2,620,80,'#ffec1e');X.globalAlpha=1;
  [['Claude Code','作る・自動投稿',COL.cc],['Muse ×2','ほかのSNSに投稿',COL.ms],['シート','投稿リスト・数字',COL.obs]].forEach((b,i)=>{
   const p=ease(seg(t,1.2+i*.5,1.8+i*.5));box(60+i*330,820,300,250,b[2],b[0],b[1],p);});
  const q=ease(seg(t,3,3.6));X.globalAlpha=q;X.setLineDash([18,14]);X.strokeStyle=COL.dola;X.lineWidth=6;X.beginPath();X.roundRect(160,1180,760,220,28);X.stroke();X.setLineDash([]);
  tx('＋ Dola・Obsidian',W/2,1260,50,COL.dola);tx('なくても止まらない。あると速くなる',W/2,1335,36,'#dfe6ff','NM');X.globalAlpha=1;
  foot();return;}
 if(t<16){ // 2 全体の流れ（Dolaなし）
  head('全体の流れ','Dola がいなくても1周できる');
  const n=[[W/2-210,300,420,150,COL.ka,'加藤さん','決める・確認'],[60,560,440,170,COL.cc,'Claude Code','作る・Instagram'],[580,560,440,170,COL.ms,'Muse ×2','ほかのSNSに投稿'],
   [W/2-280,860,560,170,COL.obs,'シート','投稿リスト・数字']];
  n.forEach((b,i)=>box(b[0],b[1],b[2],b[3],b[4],b[5],b[6],ease(seg(t,6+i*.5,6.6+i*.5))));
  arrow(W/2-100,455,280,555,seg(t,8.4,9.1),'#ffffff88');arrow(W/2+100,455,800,555,seg(t,8.7,9.4),'#ffffff88');
  arrow(280,735,W/2-150,855,seg(t,9.6,10.3),COL.cc);arrow(800,735,W/2+150,855,seg(t,9.9,10.6),COL.ms);
  arrow(W/2-280,945,130,740,seg(t,10.8,11.5),COL.obs);
  const d=ease(seg(t,11.6,12.2));X.globalAlpha=d;X.setLineDash([16,12]);X.strokeStyle=COL.dola;X.lineWidth=5;X.beginPath();X.roundRect(W/2-260,1110,520,150,24);X.stroke();X.setLineDash([]);
  tx('＋ Dola（あれば）',W/2,1160,42,COL.dola);tx('整理して探しやすくする',W/2,1215,32,'#dfe6ff','NM');X.globalAlpha=1;
  const g=ease(seg(t,12.5,13.3));X.globalAlpha=g;rr(80,1420,920,250,30,'#1b2650');lines(['完成品を置く → 投稿する → 数字をシートへ','→ Claude Code が読んで次を良くする'],W/2,1500,42,'#fff',80,'NM','center');X.globalAlpha=1;
  foot();return;}
 if(t<23){head('Claude Code の使い方','作る・自動で出す・毎晩考える');
  card(300,COL.cc,'Claude Code（作る）',['Instagram を全部作って自動で出す','毎晩23:55 会議 → 明日を良くする','note・他のSNSの原稿を作る','他のSNSの数字も日曜に読む','月1回 Obsidian を一周'],ease(seg(t,16.2,17)));
  const a=ease(seg(t,18.5,19.3));X.globalAlpha=a;rr(60,1120,960,330,30,'#1b2650');tx('決まった時間だけ動く',W/2,1190,48,COL.cc);lines(['8:00 数字と公開　23:55 振り返り','月・水 21:00 リール・カルーセル','金 21:30 ストーリー　日 21:00 週のまとめ'],W/2,1280,38,'#fff',62,'NM','center');X.globalAlpha=1;foot();return;}
 if(t<31){head('Muse の使い方','2人で分けて投稿する');
  card(290,COL.ms,'スポーツ用 Muse',['note（スポーツの主催の裏側）','YouTube・TikTok・Pinterest','イベントアプリ・口コミの返信','公式LINE の確認・毎日の見回り','日曜に数字をシートへ'],ease(seg(t,23.2,24)));
  card(980,COL.ma,'AI 用 Muse',['note（AI の仕組み）','人気の曲集め（名前と雰囲気）'],ease(seg(t,25,25.8)));
  const a=ease(seg(t,27,27.8));X.globalAlpha=a;rr(60,1400,960,260,30,'#1b2650');lines(['時間になったら投稿（1日4回見る）','中身は変えない・長い相談はしない','上限が来たら翌日つづきから'],W/2,1470,40,'#fff',70,'NM','center');X.globalAlpha=1;foot();return;}
 if(t<39){head('Obsidian と Dola','Dola がいない日も止まらない');
  card(290,COL.obs,'Dola なし（土台）',['00_Inbox に日付つきで置くだけ','日曜に Claude Code がその週分だけ読む','月1回の一周も Claude Code'],ease(seg(t,31.2,32)));
  card(900,COL.dola,'Dola あり（＋）',['振り分け・ノートをつなぐ・level','長い記録を 80_保管 へ移す','探すのが速くなる・読む量が減る'],ease(seg(t,33.5,34.3)));
  foot();return;}
 head('加藤さんがすること','決める・見る・撮る');
 const a=ease(seg(t,39.2,40));X.globalAlpha=a;
 [['決める','方針・やめること・値段',COL.ka],['見る','出た投稿と数字を見て「直して」',COL.cc],['撮る','開催の日の写真（顔はこちらで処理）',COL.ms]].forEach((r,i)=>{rr(60,320+i*260,960,220,30,'#1b2650');rr(60,320+i*260,20,220,10,r[2]);tx(r[0],W/2,390+i*260,60,r[2]);tx(r[1],W/2,470+i*260,40,'#fff','NM');});
 X.globalAlpha=ease(seg(t,41,42));rr(60,1150,960,300,30,'#2a3570');tx('軽く回す決まり',W/2,1220,50,'#ffec1e');lines(['1件1ファイル・30行まで','ふだん読まない物は 80_保管へ'],W/2,1310,42,'#fff',70,'NM','center');X.globalAlpha=1;foot();
};
window.render(0);
</script></body></html>
